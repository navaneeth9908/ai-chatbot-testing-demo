[project]
name = "ai-chatbot-testing-demo"
version = "0.1.0"
description = "Beginner-friendly AI/chatbot QA demo: golden datasets, guardrails, non-deterministic output evaluation, metrics, and pytest automation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
